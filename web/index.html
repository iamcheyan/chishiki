<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F3EA">
<title>chishiki</title>
<script>
/* 主题先行: localStorage > 系统偏好, 防 FOUC */
(function(){
  try{
    var t = localStorage.getItem('chishiki:theme');
    if(t !== 'light' && t !== 'dark'){
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="app.css?v=6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='3' width='13' height='18' rx='1.5' fill='none' stroke='%234A5568' stroke-width='1.5'/%3E%3Cpath d='M8 8h5M8 12h5' stroke='%234A5568' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="btn-menu" class="icon-btn mobile-only" aria-label="サイドバー" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">chishiki</div>
    <span class="brand-sep" aria-hidden="true"></span>
    <span id="crumb" class="crumb"></span>
    <div class="topbar-right">
      <span id="save-state" class="save-state" aria-live="polite"><span class="dot"></span><span class="label"></span></span>
      <button id="btn-outline" class="icon-btn mobile-only" aria-label="目次" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" aria-label="テーマ" aria-haspopup="menu">
      <button id="btn-font" class="icon-btn" aria-label="フォント切替" title="明朝体/ゴシック切替"></button>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar" aria-label="ライブラリ">
      <div class="side-top">
        <button id="btn-search-open" class="side-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>検索…</span>
          <kbd>⌘K</kbd>
        </button>
        <button id="btn-newdoc" class="side-new">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>新規</span>
        </button>
      </div>
      <nav id="tree" class="tree" aria-label="ドキュメント"></nav>
      <section id="recent-sec" class="side-sec" hidden>
        <h2 class="side-h">最近</h2>
        <ul id="recent-list" class="side-list"></ul>
      </section>
      <section id="fav-sec" class="side-sec" hidden>
        <div class="side-h-row">
          <h2 class="side-h">お気に入り</h2>
          <button type="button" id="fav-manage" class="side-manage">管理</button>
        </div>
        <ul id="fav-list" class="side-list"></ul>
      </section>
    </aside>
    <div id="drawer-backdrop" hidden></div>

    <main id="main" tabindex="-1">
      <section id="view-home" class="view home" hidden>
        <div class="empty-state">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
          <p>まだドキュメントがありません。</p>
          <button id="btn-home-new" class="btn-ghost">新規作成</button>
        </div>
      </section>

      <article id="view-doc" class="view doc" hidden>
        <header class="doc-head">
          <h1 id="doc-title" class="doc-title"></h1>
          <div class="doc-meta">
            <span id="doc-path" class="doc-path"></span>
            <span id="doc-mtime" class="doc-mtime"></span>
            <span class="doc-actions">
              <button id="btn-star" class="icon-btn" aria-label="お気に入り">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
              </button>
              <button id="btn-edit" class="btn-ghost btn-edit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3.5l3.5 3.5L8 19.5 3.5 20.5 4.5 16z"/></svg>
                <span>編集</span>
              </button>
            </span>
          </div>
        </header>
        <div id="md-body" class="md-body"></div>
      </article>

      <section id="view-editor" class="view editor" hidden></section>

      <section id="view-gallery" class="view gallery" hidden>
        <header class="g-head">
          <h1 id="g-title" class="doc-title"></h1>
          <p id="g-stats" class="doc-mtime"></p>
        </header>
        <div id="g-grid" class="g-grid"></div>
        <div id="g-empty" class="empty-state" hidden>
          <p>このフォルダに画像はありません。</p>
        </div>
      </section>
    </main>

    <aside id="outline" aria-label="目次" hidden>
      <h2 class="side-h">目次</h2>
      <nav id="outline-nav"></nav>
    </aside>
  </div>
</div>

<button id="back-top" class="icon-btn" aria-label="上へ戻る" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div id="search-panel" class="search-panel" role="dialog" aria-modal="true" aria-label="検索" hidden>
  <div class="search-card">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="検索…" autocomplete="off" spellcheck="false"
             aria-label="検索語" aria-controls="search-results">
      <kbd>esc</kbd>
    </div>
    <div id="search-results" class="search-results" role="listbox" aria-label="検索結果"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="画像ビューア" hidden>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
  </div>
  <button id="lb-close" class="icon-btn lb-btn lb-close" aria-label="閉じる">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button id="lb-prev" class="icon-btn lb-btn lb-prev" aria-label="前の画像">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="lb-next" class="icon-btn lb-btn lb-next" aria-label="次の画像">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-bar">
    <span id="lb-count"></span>
    <button id="lb-delete" class="lb-action" hidden>削除</button>
  </div>
</div>

<div id="dialog-root"></div>
<div id="menu-root"></div>
<div id="toast-root" aria-live="polite"></div>

<input id="file-input" type="file" accept="image/*" hidden>

<script type="module" src="js/app.js?v=6"></script>
</body>
</html>
