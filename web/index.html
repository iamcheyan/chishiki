<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F3EA">
<title>chishiki</title>
<script>
/* 主题先行: localStorage > 系统偏好, 防 FOUC */
(function(){
  try{
    var t = localStorage.getItem('chishiki:theme');
    var themes = ['light','dark','github-light','github-dark','nord','solarized-light','solarized-dark','gruvbox-dark'];
    if(themes.indexOf(t) < 0){
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="app.css?v=26">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='3' width='13' height='18' rx='1.5' fill='none' stroke='%234A5568' stroke-width='1.5'/%3E%3Cpath d='M8 8h5M8 12h5' stroke='%234A5568' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="btn-menu" class="icon-btn mobile-only" aria-label="Sidebar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">chishiki</div>
    <span class="brand-sep" aria-hidden="true"></span>
    <span id="crumb" class="crumb"></span>
    <div class="topbar-actions">
      <button id="btn-search-top" class="top-search" aria-label="Search" title="Full-text search (⌘K)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="ts-label">Search</span>
        <kbd class="ts-kbd">⌘K</kbd>
      </button>
      <button id="btn-newdoc-top" class="top-newdoc" aria-label="New document" title="New document">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="tn-label">New</span>
      </button>
    </div>
    <div class="topbar-right">
      <span id="save-state" class="save-state" aria-live="polite"><span class="dot"></span><span class="label"></span></span>
      <button id="btn-outline" class="icon-btn mobile-only" aria-label="Contents" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" aria-label="Theme" aria-haspopup="menu" title="Change theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </button>
      <button id="btn-font" class="icon-btn" aria-label="Change font" title="Serif / Sans">A</button>
      <button id="btn-git" class="icon-btn" aria-label="Version" title="Git version and commit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.3 7l7.4 3.8"/></svg>
      </button>
      <button id="btn-health" class="icon-btn" aria-label="Health check" title="Health check and data cleanup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
      </button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar" aria-label="Library">
      <div class="side-tabs" role="tablist">
        <button type="button" id="tab-all" class="side-tab active" role="tab" aria-selected="true">All</button>
        <button type="button" id="tab-fav" class="side-tab" role="tab" aria-selected="false">Favorites</button>
      </div>
      <nav id="tree" class="tree" aria-label="Documents"></nav>
      <section id="fav-sec" class="side-sec" hidden>
        <ul id="fav-list" class="side-list"></ul>
      </section>
    </aside>
    <div id="drawer-backdrop" hidden></div>

    <main id="main" tabindex="-1">
      <section id="view-home" class="view home" hidden>
        <div class="empty-state">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
          <p>No documents yet.</p>
          <button id="btn-home-new" class="btn-ghost">Create new</button>
        </div>
      </section>

      <section id="view-git" class="view git" hidden>
        <header class="doc-head">
          <h1 class="doc-title">Version</h1>
          <h2 id="git-doc-title" class="git-doc" hidden></h2>
          <div class="doc-meta"><span class="doc-path">Git history and commits</span></div>
        </header>
        <div id="git-body" class="md-body"></div>
        <div class="hl-actions">
          <button id="btn-git-commit" class="btn-ghost" hidden>Commit all</button>
        </div>
      </section>

      <section id="view-health" class="view health" hidden>
        <header class="doc-head">
          <h1 class="doc-title">Health check</h1>
          <div class="doc-meta"><span id="hl-summary" class="doc-path"></span></div>
        </header>
        <div id="hl-body" class="md-body"></div>
        <div class="hl-actions">
          <button id="btn-clean-dry" class="btn-ghost">Review cleanup</button>
          <button id="btn-clean-run" class="btn-ghost" hidden>Delete unused images</button>
        </div>
      </section>

      <article id="view-doc" class="view doc" hidden>
        <header class="doc-head">
          <h1 id="doc-title" class="doc-title"></h1>
          <div class="doc-meta">
            <span id="doc-path" class="doc-path"></span>
            <span id="doc-mtime" class="doc-mtime"></span>
            <span class="doc-actions">
              <button id="btn-export-pdf" class="icon-btn" aria-label="Save as PDF" title="Save as PDF">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 12h6M9 16h4"/></svg>
              </button>
              <button id="btn-star" class="icon-btn" aria-label="Favorites">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
              </button>
              <button id="btn-edit" class="btn-ghost btn-edit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3.5l3.5 3.5L8 19.5 3.5 20.5 4.5 16z"/></svg>
                <span>Edit</span>
              </button>
            </span>
          </div>
        </header>
        <div id="md-body" class="md-body"></div>
      </article>

      <section id="view-editor" class="view editor" hidden></section>

      <section id="view-gallery" class="view gallery" hidden>
        <header class="g-head">
          <h1 id="g-title" class="doc-title"></h1>
          <p id="g-stats" class="doc-mtime"></p>
        </header>
        <div id="g-grid" class="g-grid"></div>
        <div id="g-empty" class="empty-state" hidden>
          <p>No images in this folder.</p>
        </div>
      </section>
    </main>

    <aside id="outline" aria-label="Contents" hidden>
      <h2 class="side-h">Contents</h2>
      <nav id="outline-nav"></nav>
    </aside>
  </div>
</div>

<button id="back-top" class="icon-btn" aria-label="Back to top" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div id="search-panel" class="search-panel" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="search-card">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Search…" autocomplete="off" spellcheck="false"
             aria-label="Search term" aria-controls="search-results">
      <kbd>esc</kbd>
    </div>
    <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
  </div>
  <button id="lb-close" class="icon-btn lb-btn lb-close" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button id="lb-prev" class="icon-btn lb-btn lb-prev" aria-label="Previous image">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="lb-next" class="icon-btn lb-btn lb-next" aria-label="Next image">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-bar">
    <span id="lb-count"></span>
    <button id="lb-delete" class="lb-action" hidden>Delete</button>
  </div>
</div>

<div id="dialog-root"></div>
<div id="menu-root"></div>
<div id="toast-root" aria-live="polite"></div>

<input id="file-input" type="file" accept="image/*" hidden>

<script type="module" src="js/app.js?v=26"></script>
</body>
</html>
